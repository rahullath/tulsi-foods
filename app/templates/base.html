<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block meta %}
  <meta name="description" content="Tulsi Foods — pure vegetarian, home-style North Indian food in Mylapore, Chennai. Order direct on WhatsApp, no platform fees.">
  <title>Tulsi Foods — Pure Veg North Indian Food, Mylapore, Chennai</title>
  {% endblock %}
  {% block canonical %}{% endblock %}
  <link rel="icon" type="image/png" href="/static/logo.png">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NM9MWZ7VSC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-NM9MWZ7VSC');
  </script>
  {% block fonts %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  {% endblock %}
  {% block styles %}
  <link rel="stylesheet" href="/static/style.css">
  {% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
