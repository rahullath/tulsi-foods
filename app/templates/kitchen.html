{% extends "base.html" %}
{% block meta %}
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kitchen | Tulsi Foods</title>
{% endblock %}
{% block body %}
<div id="kitchen-app">
  <header class="kh">
    <img src="/static/logo.png" alt="" class="kh-logo">
    <div>
      <div class="kh-title">Kitchen</div>
      <div class="kh-sub" id="kh-summary">Loading…</div>
    </div>
  </header>

  <div id="orders-list" class="k-orders-list"></div>
  <div id="orders-empty" class="k-empty" hidden>
    <div class="k-empty-icon">&#10003;</div>
    <div class="k-empty-text">No orders right now</div>
  </div>
</div>

<style>
:root {
  --g: #0E7A45; --amber: #B5690A; --amberbg: #FBF0DE;
  --blue: #1B5FA8; --bluebg: #E7F0FA;
  --bg: #F6F3EC; --card: #fff; --border: #E7E1D6; --ink: #171A14; --sub: #6F7468;
}
* { box-sizing: border-box; margin: 0; }
html, body { -webkit-tap-highlight-color: transparent; }
body { font-family: 'IBM Plex Sans', system-ui, sans-serif; background: var(--bg); color: var(--ink); }

#kitchen-app { max-width: 560px; margin: 0 auto; min-height: 100dvh; padding-bottom: 30px; }

.kh { display: flex; align-items: center; gap: 14px; background: var(--g); color: #fff; padding: 20px 20px; position: sticky; top: 0; z-index: 5; }
.kh-logo { width: 46px; height: 46px; background: #fff; border-radius: 50%; padding: 4px; object-fit: contain; flex: 0 0 auto; }
.kh-title { font-size: 26px; font-weight: 700; }
.kh-sub { font-size: 15px; opacity: .9; margin-top: 2px; }

.k-orders-list { display: flex; flex-direction: column; gap: 16px; padding: 16px; }

.k-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; border-left: 8px solid var(--border); }
.k-card.k-new { border-left-color: var(--amber); }
.k-card.k-preparing { border-left-color: var(--g); }
.k-card.k-ready { border-left-color: var(--g); }
.k-card.k-out_for_delivery { border-left-color: var(--sub); opacity: .85; }

.k-top { padding: 16px 18px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.k-name { font-size: 22px; font-weight: 700; }
.k-meta { font-size: 15px; color: var(--sub); margin-top: 3px; }
.k-stage { font-size: 13px; font-weight: 700; letter-spacing: .03em; border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.k-stage.k-new { color: var(--amber); background: var(--amberbg); }
.k-stage.k-preparing, .k-stage.k-ready { color: var(--g); background: #E4F0E6; }
.k-stage.k-out_for_delivery { color: var(--sub); background: #F1EEE7; }

.k-items { padding: 12px 18px 0; font-size: 18px; line-height: 1.7; }
.k-notes { margin: 10px 18px 0; background: #FBF0DE; border-radius: 12px; padding: 10px 13px; font-size: 16px; font-style: italic; }

.k-address { margin: 12px 18px 0; font-size: 16px; line-height: 1.5; color: #4A4F45; }

.k-pay { margin: 12px 18px 0; border-radius: 12px; padding: 12px 14px; font-size: 17px; font-weight: 600; }
.k-pay.k-cod { background: var(--amberbg); color: var(--amber); }
.k-pay.k-upi { background: var(--bluebg); color: var(--blue); }

.k-actions { padding: 16px 18px 18px; }
.k-btn { display: block; width: 100%; border: none; border-radius: 14px; padding: 22px; text-align: center; font-size: 20px; font-weight: 700; cursor: pointer; color: #fff; background: var(--g); }
.k-btn:active { transform: scale(0.98); }
.k-btn.k-busy { opacity: .6; pointer-events: none; }

.k-sub-action { display: block; text-align: center; margin-top: 14px; font-size: 15px; color: var(--sub); text-decoration: underline; background: none; border: none; cursor: pointer; width: 100%; padding: 6px; }

.k-status-line { padding: 0 18px 18px; font-size: 17px; color: var(--sub); text-align: center; }

.k-empty { text-align: center; padding: 80px 20px; color: var(--sub); }
.k-empty-icon { font-size: 40px; color: var(--g); }
.k-empty-text { font-size: 18px; margin-top: 10px; }

.k-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 16px 24px; border-radius: 999px; font-size: 17px; font-weight: 600; z-index: 30; animation: kFadeUp .3s ease; }
@keyframes kFadeUp { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

.k-flash { animation: kFlash 1.4s ease 2; }
@keyframes kFlash { 0%, 100% { box-shadow: none; } 50% { box-shadow: 0 0 0 6px var(--amber); } }
</style>

<script src="/static/kitchen.js"></script>
{% endblock %}
